name: Promptfoo Code Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  issues: read
  pull-requests: write

concurrency:
  group: promptfoo-scan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Promptfoo Code Scan
        uses: promptfoo/code-scan-action@v0.1.4
        with:
          github-token: ${{ github.token }}
          config-path: .promptfoo-code-scan.yaml
          min-severity: medium
